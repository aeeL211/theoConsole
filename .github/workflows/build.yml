name: Android CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "${ANDROID_HOME:?ANDROID_HOME is not set}/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;36.0.0"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release keystore decoded."
          else
            echo "KEYSTORE_BASE64 is empty; release will use debug signing."
          fi

      - name: Lint, test, and build release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle lintRelease testReleaseUnitTest assembleRelease --stacktrace 2>&1 | tee gradle-build.log

      - name: Report Gradle failure
        if: failure()
        run: |
          if [ ! -f gradle-build.log ]; then
            echo "::error::Gradle did not produce a log file."
            exit 0
          fi
          message="$(awk '/^\* What went wrong:/{flag=1} flag{print} /^\* Try:/{flag=0}' gradle-build.log | head -n 40)"
          if [ -z "$message" ]; then
            message="$(tail -n 40 gradle-build.log)"
          fi
          message="${message//'%'/'%25'}"
          message="${message//$'\n'/'%0A'}"
          echo "::error title=Gradle failure::$message"
          grep -E '(^e: |^> Task .* FAILED|^[0-9]+ tests completed|^There were failing tests|^FAILED|^Lint found|^.*\.kt:[0-9]+:[0-9]+:|^.*\.xml:[0-9]+:)' gradle-build.log \
            | tail -n 20 \
            | while IFS= read -r line; do echo "::error::$line"; done

      - name: Upload Gradle log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-log-${{ github.sha }}
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare APK
        run: cp app/build/outputs/apk/release/app-release.apk theo-console.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: theo-console
          path: theo-console.apk
          if-no-files-found: error
          retention-days: 14
